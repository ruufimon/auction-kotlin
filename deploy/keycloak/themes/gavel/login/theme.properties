# Gavel login theme (issue #30, USR-014). Layered on Keycloak's built-in "keycloak" login theme:
# the stylesheet restyles it to the design canvas, register.ftl adds password-policy hints, and the
# messages change the wording. Bump themeVersion with every change (USR-014: versioned theme).
parent=keycloak
import=common/keycloak
styles=css/login.css css/gavel.css
themeVersion=1.0.0
kcLogoLink=/

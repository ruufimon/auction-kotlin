openapi: 3.1.0
info:
  title: Gavel Auction API
  version: 1.0.0
  summary: Timed English auctions for single physical items.
  description: |
    Versioned JSON API for the Gavel web app, covering user onboarding, the
    product catalog, bidding, and settlement.

    ## Conventions
    - **Money** is always `{ amountMinor, currency }` in integer minor units
      (cents for USD). The deployment uses one currency; others are rejected.
    - **Timestamps** are ISO 8601 UTC strings generated by the server. Compute
      countdowns from `endAt` minus the `Date` response header, not the device clock.
    - **Identifiers** are opaque strings (UUIDs). Never parse or order them.
    - **Errors** share one envelope (`Error`) with a stable `code`, a readable
      `message`, a `correlationId` to quote in support requests, and optional
      field-level `fields`. Status codes: `400` malformed input, `401`
      authentication, `403` not allowed, `404` not found, `409` state or
      version conflict, `422` domain rule violation, `429` rate limited.
    - **Correlation**: send `X-Correlation-Id` to trace a request; it is echoed back.
    - **Pagination** is cursor-based: pass `nextCursor` back as `cursor`. `limit`
      defaults to 20 and must be 1–50.
    - **Concurrency**: mutable resources carry `version` (also sent as `ETag`).
      Send it back in `If-Match` to fail with `409 VERSION_CONFLICT` instead of
      overwriting someone else's change.
    - **Idempotency**: bids require an `Idempotency-Key` header. Repeating a
      request with the same key returns the original result (`200` with
      `Idempotent-Replayed: true`); reusing it for a different bid returns `409 IDEMPOTENCY_KEY_REUSED`.

    ## Sessions
    Sign-in and email verification return a short-lived access token (send it as
    `Authorization: Bearer <token>`) and set an HttpOnly `gavel_refresh` cookie
    scoped to `/api/v1/auth`. Call `POST /auth/refresh` with credentials
    included (`fetch(..., { credentials: "include" })`) to rotate it. Reusing an
    already-rotated refresh token ends every session in that family.
servers:
  - url: https://gavel-ii74u.ondigitalocean.app
    description: Production (DigitalOcean App Platform)
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Registration, email verification and sessions.
  - name: Account
    description: The signed-in user's profile and seller enablement.
  - name: Catalog
    description: Public browsing of auctions.
  - name: Selling
    description: Managing the signed-in seller's listings.
  - name: Bidding
    description: Placing bids and bid history.
  - name: Orders
    description: Checkout, shipment and delivery for won and sold auctions.
  - name: Payments
    description: Payment provider callbacks.
  - name: Operations
    description: Health probes and operator endpoints.

paths:
  /api/v1/openapi.yaml:
    get:
      tags: [Operations]
      operationId: getOpenApiSpec
      summary: This OpenAPI document
      description: Generate client types from it, e.g. `npx openapi-typescript <api>/api/v1/openapi.yaml -o types/api.d.ts`.
      security: []
      responses:
        "200":
          description: The specification.
          content: { application/yaml: { schema: { type: string } } }
  /health/live:
    get:
      tags: [Operations]
      operationId: getLiveness
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: The process is alive.
          content: { text/plain: { schema: { type: string, const: OK } } }
  /health/ready:
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Readiness probe
      description: Fails while the database is unreachable.
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
          content: { text/plain: { schema: { type: string, const: READY } } }
        "503":
          description: Required infrastructure is unavailable.
          content: { text/plain: { schema: { type: string, const: NOT READY } } }

  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register an account
      description: |
        Creates a `PENDING_VERIFICATION` account and emails a single-use
        verification link (`{WEB_BASE_URL}/verify-email?token=...`, valid 24 hours).
        The account cannot sign in or bid until it is verified.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Account created.
          content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Verify an email address
      description: Consumes the token from the verification link, activates the account and signs the user in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: "`VERIFICATION_TOKEN_INVALID`: the token is unknown, used or expired."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /api/v1/auth/verify-email/resend:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Resend the verification email
      description: Always returns 202, so the response never reveals whether an email is registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, const: ACCEPTED } } }
  /api/v1/auth/sign-in:
    post:
      tags: [Auth]
      operationId: signIn
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401":
          description: "`INVALID_CREDENTIALS`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: "`EMAIL_NOT_VERIFIED` or `ACCOUNT_SUSPENDED`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate the refresh token
      description: Reads the `gavel_refresh` cookie, rotates it and returns a new access token.
      security:
        - refreshCookie: []
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401":
          description: "`REFRESH_TOKEN_INVALID`: missing, expired, revoked or reused. The cookie is cleared."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /api/v1/auth/sign-out:
    post:
      tags: [Auth]
      operationId: signOut
      summary: Sign out
      description: Revokes the refresh token family and clears the cookie.
      security:
        - refreshCookie: []
      responses:
        "204": { description: Signed out. }

  /api/v1/me:
    get:
      tags: [Account]
      operationId: getMe
      summary: Get the signed-in user
      responses:
        "200":
          description: The profile.
          headers: {}
          content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    patch:
      tags: [Account]
      operationId: updateMe
      summary: Update the profile
      description: Fields that are omitted or null are left unchanged.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: Updated profile.
          content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/me/seller-profile:
    put:
      tags: [Account]
      operationId: putSellerProfile
      summary: Complete or replace the seller profile
      description: |
        Selling requires a display name, phone, bio, handling time and origin
        address. `Me.sellerEligible` turns true once all are present;
        `Me.missingSellerFields` lists what is still needed.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SellerProfile" }
      responses:
        "200":
          description: Updated profile.
          content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: List categories
      security: []
      responses:
        "200":
          description: Categories in display order.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Category" } }
  /api/v1/listings:
    get:
      tags: [Catalog]
      operationId: searchListings
      summary: Search public listings
      security: []
      parameters:
        - { name: q, in: query, description: "Case-insensitive text in the title or description (max 100 characters).", schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, description: Category slug., schema: { type: string } }
        - name: status
          in: query
          description: Comma-separated public statuses. Defaults to `ACTIVE,SCHEDULED`.
          schema: { type: string, example: "ACTIVE,SCHEDULED" }
        - { name: minPrice, in: query, description: Minimum current price in minor units., schema: { type: integer, format: int64 } }
        - { name: maxPrice, in: query, description: Maximum current price in minor units., schema: { type: integer, format: int64 } }
        - { name: endsBefore, in: query, schema: { type: string, format: date-time } }
        - name: sort
          in: query
          schema: { type: string, enum: [ending_soon, newest, price_asc, price_desc], default: ending_soon }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of listings.
          content: { application/json: { schema: { $ref: "#/components/schemas/ListingPage" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/listings/{listingId}:
    get:
      tags: [Catalog]
      operationId: getListing
      summary: Get a listing
      description: Public for SCHEDULED, ACTIVE, SOLD and UNSOLD listings. Signed-in sellers can also read their own drafts and cancelled listings here.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: The listing.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content: { application/json: { schema: { $ref: "#/components/schemas/Listing" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/listings:
    get:
      tags: [Selling]
      operationId: listMyListings
      summary: List my listings
      description: Every status, most recently updated first.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of listings.
          content: { application/json: { schema: { $ref: "#/components/schemas/ListingPage" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Selling]
      operationId: createListingDraft
      summary: Create a draft listing
      description: Drafts can be incomplete; every field is checked at publication. Requires an eligible seller (`SELLER_PROFILE_INCOMPLETE` otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingInput" }
      responses:
        "201":
          description: Draft created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content: { application/json: { schema: { $ref: "#/components/schemas/Listing" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/me/listings/{listingId}:
    parameters:
      - $ref: "#/components/parameters/ListingId"
    get:
      tags: [Selling]
      operationId: getMyListing
      summary: Get one of my listings
      responses:
        "200":
          description: The listing.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content: { application/json: { schema: { $ref: "#/components/schemas/Listing" } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Selling]
      operationId: updateMyListing
      summary: Edit a listing
      description: |
        DRAFT and SCHEDULED listings can change any field (SCHEDULED ones must
        stay publishable). While ACTIVE, only `description`, `condition` and
        `images` can change (`409 LISTING_LOCKED`). Ended and cancelled
        listings can't change (`409 LISTING_NOT_EDITABLE`).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingInput" }
      responses:
        "200":
          description: Updated listing.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content: { application/json: { schema: { $ref: "#/components/schemas/Listing" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/RuleViolation" }
  /api/v1/me/listings/{listingId}/publish:
    parameters:
      - $ref: "#/components/parameters/ListingId"
    post:
      tags: [Selling]
      operationId: publishListing
      summary: Publish a draft
      description: |
        Publishes without review. The listing becomes SCHEDULED, or ACTIVE right
        away when `startAt` has passed. Incomplete or invalid listings fail with
        `422 LISTING_INCOMPLETE` and per-field errors.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Published listing.
          content: { application/json: { schema: { $ref: "#/components/schemas/Listing" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/RuleViolation" }
  /api/v1/me/listings/{listingId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ListingId"
    post:
      tags: [Selling]
      operationId: cancelListing
      summary: Cancel a listing
      description: Final. Allowed for DRAFT, SCHEDULED and ACTIVE listings with no accepted bid (`409 LISTING_HAS_BIDS` otherwise).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Cancelled listing.
          content: { application/json: { schema: { $ref: "#/components/schemas/Listing" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/listings/{listingId}/bids:
    parameters:
      - $ref: "#/components/parameters/ListingId"
    get:
      tags: [Bidding]
      operationId: listPublicBids
      summary: Public bid history
      description: Newest first. Bidders are masked as stable per-auction aliases ("Bidder 1").
      security: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of bids.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PublicBid" } }
                  nextCursor: { type: [string, "null"] }
    post:
      tags: [Bidding]
      operationId: placeBid
      summary: Place a bid
      description: |
        Accepted only while the auction is ACTIVE and the server receives the bid
        before `endAt`. The first bid must be at least the starting price; later
        bids at least the current price plus the minimum increment (see
        `Listing.minimumNextBid`). Bids can't be withdrawn.

        Rejection codes: `AUCTION_NOT_ACTIVE`, `AUCTION_ENDED`, `BID_TOO_LOW`,
        `CURRENCY_MISMATCH` (422); `SELLER_CANNOT_BID`, `ACCOUNT_NOT_ELIGIBLE` (403).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated key (e.g. a UUID) reused on retries of the same bid.
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { $ref: "#/components/schemas/Money" }
      responses:
        "201":
          description: Bid accepted.
          content: { application/json: { schema: { $ref: "#/components/schemas/BidResult" } } }
        "200":
          description: Replay of an earlier request with the same Idempotency-Key.
          headers:
            Idempotent-Replayed: { schema: { type: string, const: "true" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/BidResult" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/RuleViolation" }
  /api/v1/me/bids:
    get:
      tags: [Bidding]
      operationId: listMyBids
      summary: My bids
      description: The signed-in user's complete bid history, newest first.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of bids.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MyBid" } }
                  nextCursor: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/orders:
    get:
      tags: [Orders]
      operationId: listMyOrders
      summary: Orders I won or sold
      parameters:
        - name: role
          in: query
          schema: { type: string, enum: [buyer, seller], default: buyer }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of orders.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Order" } }
                  nextCursor: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/orders/{orderId}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get an order
      description: Visible only to the order's buyer and seller.
      responses:
        "200":
          description: The order.
          content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/orders/{orderId}/checkout:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      tags: [Orders]
      operationId: checkoutOrder
      summary: Start or resume checkout
      description: |
        Winning buyer only, while the order is `PAYMENT_PENDING` and before
        `paymentDeadline`. Returns the open attempt if one exists; after a
        failed attempt it starts a new one. Redirect the buyer to `checkoutUrl`.
        Returning from the provider does **not** mark the order paid; only the
        provider's signed webhook does, so poll the order afterwards.
        Uses the buyer's current shipping address (`422 SHIPPING_ADDRESS_REQUIRED` if missing).
      responses:
        "201":
          description: New attempt started.
          content: { application/json: { schema: { $ref: "#/components/schemas/Checkout" } } }
        "200":
          description: Open attempt resumed.
          content: { application/json: { schema: { $ref: "#/components/schemas/Checkout" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/RuleViolation" }
  /api/v1/orders/{orderId}/shipment:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      tags: [Orders]
      operationId: shipOrder
      summary: Record shipment
      description: The order's seller only, after payment. Moves the order to SHIPPED.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [carrier, trackingReference]
              properties:
                carrier: { type: string, minLength: 2, maxLength: 60 }
                trackingReference: { type: string, minLength: 3, maxLength: 100 }
      responses:
        "200":
          description: Updated order.
          content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/orders/{orderId}/delivery:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      tags: [Orders]
      operationId: confirmDelivery
      summary: Confirm delivery
      description: The order's buyer only, after shipment. Moves the order to DELIVERED.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Updated order.
          content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/payments/webhooks/{provider}:
    post:
      tags: [Payments]
      operationId: receivePaymentWebhook
      summary: Payment provider webhook
      description: |
        Called by the payment provider, not by the web app. Authenticated by
        signature: `Gavel-Signature: t=<unix seconds>,v1=<hex HMAC-SHA256 of "t.body">`
        using `PAYMENT_WEBHOOK_SECRET`, within 5 minutes. Events are processed
        once per event `id`; duplicates return 200 with no effect.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [sandbox] }
        - name: Gavel-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type, data]
              properties:
                id: { type: string }
                type: { type: string, enum: [payment.succeeded, payment.failed] }
                data:
                  type: object
                  properties:
                    reference: { type: string, description: The provider reference from the checkout URL. }
                    amountMinor: { type: integer, format: int64 }
                    currency: { type: string }
      responses:
        "200":
          description: Received.
          content:
            application/json:
              schema: { type: object, properties: { received: { type: boolean } } }
        "401":
          description: "`WEBHOOK_SIGNATURE_INVALID`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /admin/v1/accounts/{userId}/suspend:
    post:
      tags: [Operations]
      operationId: suspendAccount
      summary: Suspend an account (operator)
      description: Immediately blocks sign-in, refresh, bidding, publishing and fulfillment updates. Available only when `ADMIN_TOKEN` is configured.
      security:
        - operatorToken: []
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operator]
              properties:
                operator: { type: string, description: "Who is acting, for the audit trail." }
                reason: { type: string }
      responses:
        "200":
          description: Updated account.
          content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/v1/accounts/{userId}/reactivate:
    post:
      tags: [Operations]
      operationId: reactivateAccount
      summary: Reactivate an account (operator)
      description: Only accounts with a verified email can be reactivated.
      security:
        - operatorToken: []
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operator]
              properties:
                operator: { type: string }
      responses:
        "200":
          description: Updated account.
          content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from sign-in, verification or refresh. Expires after 15 minutes.
    refreshCookie:
      type: apiKey
      in: cookie
      name: gavel_refresh
    operatorToken:
      type: http
      scheme: bearer
      description: The deployment's `ADMIN_TOKEN`.

  parameters:
    ListingId: { name: listingId, in: path, required: true, schema: { type: string } }
    OrderId: { name: orderId, in: path, required: true, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
    Cursor: { name: cursor, in: query, description: The `nextCursor` from the previous page., schema: { type: string } }
    IfMatch:
      name: If-Match
      in: header
      description: Expected resource `version`, bare or quoted (`"3"`).
      schema: { type: string }

  headers:
    ETag:
      description: The resource `version`, quoted.
      schema: { type: string, example: '"3"' }

  responses:
    Session:
      description: Signed in. Sets the `gavel_refresh` HttpOnly cookie.
      headers:
        Set-Cookie: { schema: { type: string } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } }
    ValidationFailed:
      description: Malformed input. `fields` lists each invalid field.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthenticated:
      description: Missing, invalid or expired access token, or the account is no longer active.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: The caller may not do this (see `code`).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: No such resource, or it isn't visible to the caller.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: State or version conflict (see `code`).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RuleViolation:
      description: A domain rule was violated (see `code` and `fields`).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: Too many requests.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      required: [code, message, correlationId, fields]
      properties:
        code: { type: string, examples: [BID_TOO_LOW] }
        message: { type: string }
        correlationId: { type: string }
        fields:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string, examples: [shippingAddress.postalCode] }
              code: { type: string, examples: [REQUIRED] }
              message: { type: string }
    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor: { type: integer, format: int64, description: Integer minor units (cents)., examples: [324000] }
        currency: { type: string, pattern: "^[A-Z]{3}$", examples: [USD] }
    Address:
      type: object
      required: [line1, city, region, postalCode, country]
      properties:
        line1: { type: string, maxLength: 200 }
        line2: { type: [string, "null"], maxLength: 200 }
        city: { type: string, maxLength: 100 }
        region: { type: string, maxLength: 100 }
        postalCode: { type: string, maxLength: 20 }
        country: { type: string, pattern: "^[A-Z]{2}$", description: ISO 3166-1 alpha-2 code., examples: [US] }
    Preferences:
      type: object
      properties:
        favoriteCategories: { type: array, items: { type: string }, maxItems: 20 }
        outbidAlerts: { type: boolean, default: true }
        endingSoonAlerts: { type: boolean, default: true }
    SellerProfile:
      type: object
      required: [bio, handlingTimeDays, originAddress]
      properties:
        bio: { type: string, minLength: 20, maxLength: 280 }
        handlingTimeDays: { type: integer, minimum: 1, maximum: 10 }
        originAddress: { $ref: "#/components/schemas/Address" }
    RegisterRequest:
      type: object
      required: [email, password, displayName, acceptedTerms]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8, maxLength: 128, description: At least one letter and one number. }
        displayName: { type: string, minLength: 2, maxLength: 60 }
        phone: { type: [string, "null"] }
        acceptedTerms: { type: boolean, const: true }
    UpdateProfileRequest:
      type: object
      properties:
        displayName: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        shippingAddress: { oneOf: [{ $ref: "#/components/schemas/Address" }, { type: "null" }] }
        preferences: { oneOf: [{ $ref: "#/components/schemas/Preferences" }, { type: "null" }] }
    Me:
      type: object
      required: [id, email, status, emailVerified, displayName, preferences, sellerEligible, missingSellerFields, createdAt, version]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED] }
        emailVerified: { type: boolean }
        displayName: { type: string }
        phone: { type: [string, "null"] }
        shippingAddress: { oneOf: [{ $ref: "#/components/schemas/Address" }, { type: "null" }] }
        preferences: { $ref: "#/components/schemas/Preferences" }
        sellerProfile: { oneOf: [{ $ref: "#/components/schemas/SellerProfile" }, { type: "null" }] }
        sellerEligible: { type: boolean }
        missingSellerFields: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    Session:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: Seconds until the access token expires. }
        user: { $ref: "#/components/schemas/Me" }
    Category:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, examples: [cameras] }
        name: { type: string, examples: [Cameras] }
    ListingInput:
      type: object
      description: All fields optional; omitted or null fields are left unchanged.
      properties:
        title: { type: string, minLength: 5, maxLength: 80 }
        description: { type: string, minLength: 30, maxLength: 5000 }
        category: { type: string, description: Category slug. }
        condition: { $ref: "#/components/schemas/Condition" }
        images: { type: array, maxItems: 12, items: { type: string, format: uri, description: An https URL. } }
        startingPrice: { $ref: "#/components/schemas/Money" }
        shippingPrice: { $ref: "#/components/schemas/Money" }
        freeShipping: { type: boolean }
        origin: { $ref: "#/components/schemas/Origin" }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time, description: "1 hour to 30 days after startAt, and at least 1 hour from now." }
    Condition:
      type: string
      enum: [NEW, NEAR_MINT, EXCELLENT, VERY_GOOD, GOOD, FAIR, RESTORED, FOR_PARTS]
    Origin:
      type: object
      required: [city, region, country]
      properties:
        city: { type: string }
        region: { type: string }
        country: { type: string, pattern: "^[A-Z]{2}$" }
    Listing:
      type: object
      required: [id, status, images, bidCount, shipping, version]
      properties:
        id: { type: string }
        status: { type: string, enum: [DRAFT, SCHEDULED, ACTIVE, SOLD, UNSOLD, CANCELLED] }
        title: { type: [string, "null"] }
        description: { type: [string, "null"] }
        category: { oneOf: [{ $ref: "#/components/schemas/Category" }, { type: "null" }] }
        condition: { oneOf: [{ $ref: "#/components/schemas/Condition" }, { type: "null" }] }
        images: { type: array, items: { type: string, format: uri } }
        startingPrice: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        currentPrice:
          description: Highest accepted bid, or the starting price before the first bid. The winning bid once SOLD.
          oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }]
        minimumNextBid:
          description: The lowest acceptable next bid. Null once the auction has ended.
          oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }]
        bidCount: { type: integer }
        shipping:
          type: object
          required: [free]
          properties:
            free: { type: boolean }
            price: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        origin: { oneOf: [{ $ref: "#/components/schemas/Origin" }, { type: "null" }] }
        startAt: { type: [string, "null"], format: date-time }
        endAt: { type: [string, "null"], format: date-time }
        seller:
          oneOf:
            - type: object
              required: [id, displayName]
              properties:
                id: { type: string }
                displayName: { type: string }
            - type: "null"
        publishedAt: { type: [string, "null"], format: date-time }
        closedAt: { type: [string, "null"], format: date-time }
        version: { type: integer, format: int64 }
    ListingPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Listing" } }
        nextCursor: { type: [string, "null"] }
    AuctionPrice:
      type: object
      required: [minimumNextBid, bidCount, state]
      properties:
        currentPrice: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        minimumNextBid: { $ref: "#/components/schemas/Money" }
        bidCount: { type: integer }
        state: { type: string, enum: [OPEN, CLOSED, CANCELLED] }
    BidResult:
      type: object
      required: [bidId, listingId, amount, sequence, acceptedAt, auction]
      properties:
        bidId: { type: string }
        listingId: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        sequence: { type: integer, format: int64, description: Strictly increasing per auction. }
        acceptedAt: { type: string, format: date-time }
        auction: { $ref: "#/components/schemas/AuctionPrice" }
    PublicBid:
      type: object
      required: [sequence, bidder, amount, acceptedAt]
      properties:
        sequence: { type: integer, format: int64 }
        bidder: { type: string, examples: ["Bidder 2"] }
        amount: { $ref: "#/components/schemas/Money" }
        acceptedAt: { type: string, format: date-time }
    MyBid:
      type: object
      required: [bidId, listingId, amount, sequence, acceptedAt, isHighest, auctionState]
      properties:
        bidId: { type: string }
        listingId: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        sequence: { type: integer, format: int64 }
        acceptedAt: { type: string, format: date-time }
        isHighest: { type: boolean }
        auctionState: { type: string, enum: [OPEN, CLOSED, CANCELLED] }
    Order:
      type: object
      required: [id, listingId, title, status, role, buyerId, sellerId, itemPrice, shippingPrice, total, paymentDeadline, createdAt, version]
      properties:
        id: { type: string }
        listingId: { type: string }
        title: { type: string }
        status: { type: string, enum: [PAYMENT_PENDING, PAID, SHIPPED, DELIVERED, PAYMENT_EXPIRED] }
        role: { type: string, enum: [BUYER, SELLER], description: The caller's role on this order. }
        buyerId: { type: string }
        sellerId: { type: string }
        itemPrice: { $ref: "#/components/schemas/Money" }
        shippingPrice: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        paymentDeadline: { type: string, format: date-time }
        shipTo:
          description: Always shown to the buyer; shown to the seller once paid.
          oneOf:
            - type: object
              required: [name, line1, city, region, postalCode, country]
              properties:
                name: { type: string }
                phone: { type: [string, "null"] }
                line1: { type: string }
                line2: { type: [string, "null"] }
                city: { type: string }
                region: { type: string }
                postalCode: { type: string }
                country: { type: string }
            - type: "null"
        paidAt: { type: [string, "null"], format: date-time }
        shipment:
          oneOf:
            - type: object
              required: [carrier, trackingReference, shippedAt]
              properties:
                carrier: { type: string }
                trackingReference: { type: string }
                shippedAt: { type: string, format: date-time }
            - type: "null"
        deliveredAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    Checkout:
      type: object
      required: [orderId, attemptNumber, checkoutUrl, status, resumed]
      properties:
        orderId: { type: string }
        attemptNumber: { type: integer }
        checkoutUrl: { type: string, format: uri }
        status: { type: string, enum: [PENDING, SUCCEEDED, FAILED] }
        resumed: { type: boolean }

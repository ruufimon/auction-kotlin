name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gavel-api:ci .
      - name: Smoke test health endpoints
        run: |
          docker run -d --name api -p 8080:8080 gavel-api:ci
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/health/ready && break
            sleep 1
          done
          curl -fsS http://localhost:8080/health/live
          curl -fsS http://localhost:8080/health/ready
      - name: Container logs
        if: always()
        run: docker logs api || true

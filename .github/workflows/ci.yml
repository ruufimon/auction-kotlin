name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gavel-api:ci .
      - name: Start PostgreSQL
        run: |
          docker network create ci
          docker run -d --name db --network ci \
            -e POSTGRES_DB=auction_db -e POSTGRES_USER=auction -e POSTGRES_PASSWORD=ci-password \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec db pg_isready -U auction -d auction_db && break
            sleep 1
          done
      - name: Smoke test health endpoints
        # Runs with APP_ENV=production so missing required config fails the build.
        run: |
          docker run -d --name api --network ci -p 8080:8080 \
            -e APP_ENV=production \
            -e DB_HOST=db -e DB_NAME=auction_db -e DB_USER=auction -e DB_PASSWORD=ci-password \
            -e DB_SSLMODE=disable \
            -e OIDC_ISSUER=https://keycloak.ci.invalid/realms/gavel \
            -e ASSESSMENT_ENCRYPTION_KEY=$(openssl rand -base64 32) \
            -e INTERNAL_API_TOKEN=ci-only-operator-token \
            gavel-api:ci
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/health/ready && break
            sleep 1
          done
          curl -fsS http://localhost:8080/health/live
          curl -fsS http://localhost:8080/health/ready
      - name: Container logs
        if: always()
        run: docker logs api || true

  web:
    name: Web build, unit tests and image smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Docker image smoke test
        working-directory: .
        # Production mode: the server refuses requests unless every setting is present.
        run: |
          docker build -f web/Dockerfile -t gavel-web:ci .
          docker run -d --name web -p 8787:8787 \
            -e APP_ORIGIN=https://gavel.ci.invalid \
            -e OIDC_ISSUER=https://keycloak.ci.invalid/realms/gavel \
            -e API_ORIGIN=http://api.ci.invalid:8080 \
            -e SESSION_SECRET=$(openssl rand -hex 32) \
            gavel-web:ci
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:8787/ && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:8787/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/api/v1/me)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/profile)" = 307

  e2e:
    name: Browser end-to-end (Keycloak, API, web)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start PostgreSQL, Keycloak and Mailpit
        run: docker compose -f docker-compose.dev.yml up -d --wait postgres keycloak mailpit
      - name: Start the API
        run: |
          INTERNAL_API_TOKEN=dev-operator-token nohup ./gradlew :app:run --no-daemon > api.log 2>&1 &
          for i in $(seq 1 120); do curl -fsS -o /dev/null http://localhost:8080/health/ready && break; sleep 2; done
          curl -fsS http://localhost:8080/health/ready
      - name: Build and start the web app
        working-directory: web
        run: |
          npm ci
          npm run build
          APP_ORIGIN=http://localhost:8787 GAVEL_ALLOW_DEV_DEFAULTS=true nohup npx next start -p 8787 > ../web.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:8787/ && break; sleep 1; done
      - name: Run Playwright
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs and traces on failure
        if: failure()
        run: |
          tail -100 api.log web.log || true
          docker compose -f docker-compose.dev.yml logs --tail 100 keycloak || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7

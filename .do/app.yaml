# DigitalOcean App Platform spec for the Gavel API.
#
# Create:  doctl apps create --spec .do/app.yaml
# Update:  doctl apps update <app-id> --spec .do/app.yaml
#
name: gavel
region: sgp

services:
  - name: api
    github:
      repo: ruufimon/auction-kotlin
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    # The JVM is tight at 512 MB; 1 GB leaves headroom.
    instance_size_slug: apps-s-1vcpu-1gb
    routes:
      - path: /
    health_check:
      http_path: /health/ready
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 3
      failure_threshold: 3
    liveness_health_check:
      http_path: /health/live
      initial_delay_seconds: 30
      period_seconds: 15
      timeout_seconds: 3
      failure_threshold: 4
    envs:
      - key: JAVA_OPTS
        scope: RUN_TIME
        value: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
      # Production mode: the app refuses to start if any required setting below
      # is missing, and connects to PostgreSQL with sslmode=require.
      - key: APP_ENV
        scope: RUN_TIME
        value: production
      - key: DB_HOST
        scope: RUN_TIME
        value: ${db.HOSTNAME}
      - key: DB_PORT
        scope: RUN_TIME
        value: ${db.PORT}
      - key: DB_NAME
        scope: RUN_TIME
        value: ${db.DATABASE}
      - key: DB_USER
        scope: RUN_TIME
        value: ${db.USERNAME}
      - key: DB_PASSWORD
        scope: RUN_TIME
        value: ${db.PASSWORD}
      # Keep the pool below the cluster's connection limit (about 22 usable on
      # db-s-1vcpu-1gb) across all instances.
      - key: DB_POOL_SIZE
        scope: RUN_TIME
        value: "10"
      # Identity provider (Keycloak realm, issue #19). Until the realm is deployed this
      # placeholder keeps the app bootable; every bearer token is rejected with 401.
      - key: OIDC_ISSUER
        scope: RUN_TIME
        value: https://keycloak.not-yet-deployed.invalid/realms/gavel
      # Secrets: set values in the DigitalOcean console or via `doctl apps update`
      # (App Platform encrypts them). Never commit real values.
      # ASSESSMENT_ENCRYPTION_KEY: base64 of 32 random bytes (`openssl rand -base64 32`).
      - key: ASSESSMENT_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
      # INTERNAL_API_TOKEN: shared secret for the operator endpoints under /internal.
      - key: INTERNAL_API_TOKEN
        scope: RUN_TIME
        type: SECRET
      # Metrics export to the self-hosted SigNoz (deploy/signoz/README.md).
      # Leave OTEL_EXPORTER_OTLP_ENDPOINT unset to disable export.
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        scope: RUN_TIME
        value: https://159.65.140.90.sslip.io
      - key: OTEL_SERVICE_NAME
        scope: RUN_TIME
        value: gavel-api
      # Secret: "Authorization=Bearer <INGEST_TOKEN>"; set in the console or via doctl.
      - key: OTEL_EXPORTER_OTLP_HEADERS
        scope: RUN_TIME
        type: SECRET

# Managed PostgreSQL. The cluster must exist before this spec is applied:
#   doctl databases create gavel-db --engine pg --version 16 \
#     --region sgp1 --size db-s-1vcpu-1gb --num-nodes 1
# Then: doctl apps update <app-id> --spec .do/app.yaml
databases:
  - name: db
    engine: PG
    version: "16"
    production: true
    cluster_name: gavel-db

# DigitalOcean App Platform spec for the Gavel API.
#
# Create:  doctl apps create --spec .do/app.yaml
# Update:  doctl apps update <app-id> --spec .do/app.yaml
#
name: gavel
region: sgp

services:
  - name: api
    github:
      repo: ruufimon/auction-kotlin
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    # The JVM is tight at 512 MB; 1 GB leaves headroom.
    instance_size_slug: apps-s-1vcpu-1gb
    routes:
      - path: /
    health_check:
      http_path: /health/ready
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 3
      failure_threshold: 3
    liveness_health_check:
      http_path: /health/live
      initial_delay_seconds: 30
      period_seconds: 15
      timeout_seconds: 3
      failure_threshold: 4
    envs:
      - key: JAVA_OPTS
        scope: RUN_TIME
        value: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: WEB_BASE_URL
        scope: RUN_TIME
        value: https://gavel-auction-marketplace.ruufimon.chatgpt.site
      - key: WEB_ORIGINS
        scope: RUN_TIME
        value: https://gavel-auction-marketplace.ruufimon.chatgpt.site
      - key: SERVICE_VERSION
        scope: RUN_TIME
        value: ${_self.COMMIT_HASH}
      - key: SEED_DEMO_DATA
        scope: RUN_TIME
        value: "true"
      # Secrets: set the values in the DigitalOcean console or via
      # `doctl apps update`; App Platform encrypts them. Never commit real values.
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: PAYMENT_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: METRICS_TOKEN
        scope: RUN_TIME
        type: SECRET

# Managed PostgreSQL. A dev database is the cheapest option; switch to a
# production cluster (production: true, cluster_name: ...) before launch.
databases:
  - name: db
    engine: PG
    version: "16"

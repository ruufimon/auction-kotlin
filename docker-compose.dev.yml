version: '3.8'

# Development compose with PostgreSQL and API services
# Usage: docker-compose -f docker-compose.dev.yml up

services:
  postgres:
    image: postgres:16-alpine
    container_name: auction-postgres-dev
    environment:
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: dev-password
      POSTGRES_DB: auction_db
    ports:
      - "5432:5432"
    volumes:
      - auction_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auction-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auction-api-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: auction_db
      DB_USER: auction
      DB_PASSWORD: dev-password
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - auction-network

  web:
    # Override the default command to enable dev mode
    command: npm run dev
    
    # Mount source code for hot reload
    volumes:
      - ./web:/app:cached
      - /app/node_modules  # Preserve installed node_modules
      - /app/.next  # Preserve Next.js cache
    
    # Expose additional dev port
    ports:
      - "3000:3000"  # Additional Vite dev server port
    
    environment:
      NODE_ENV: development
      # Enable debugging if needed
      # DEBUG: "vinext:*"
    
    # Keep stdin open and allocate tty for interactive shells
    stdin_open: true
    tty: true
    networks:
      - auction-network

volumes:
  auction_postgres_data:

networks:
  auction-network:
    driver: bridge

# Usage:
#   docker-compose -f docker-compose.dev.yml up
#
# This will:
# 1. Start PostgreSQL with a healthcheck
# 2. Build and start the API service (depends on DB)
# 3. Start the web frontend
#
# To only run the database:
#   docker-compose -f docker-compose.dev.yml up postgres
#
# To rebuild:
#   docker-compose -f docker-compose.dev.yml down
#   docker-compose -f docker-compose.dev.yml up --build
#
# Connect to DB directly:
#   psql -h localhost -U auction -d auction_db

